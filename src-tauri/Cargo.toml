[package]
name = "battery-hub"
version = "0.2.0"
description = "Battery Hub — multi-brand wireless battery monitor (Razer, Logitech, Ajazz, Soundcore)"
authors = ["Axthrowa"]
edition = "2021"

[lib]
name = "battery_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6.6", features = ["windows-native"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
