<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img">
  <title>Battery Hub</title>
  <rect width="128" height="128" rx="28" fill="#0E1013"/>
  <!-- battery body -->
  <rect x="34" y="28" width="60" height="80" rx="10" fill="none" stroke="#5EEAD4" stroke-width="6"/>
  <!-- terminal -->
  <rect x="52" y="16" width="24" height="12" rx="3" fill="#5EEAD4"/>
  <!-- charge fill ~70% -->
  <rect x="42" y="48" width="44" height="50" rx="6" fill="#5EEAD4"/>
</svg>
